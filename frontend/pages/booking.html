<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Room | UH Sugar Land</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>

<header class="site-header">
  <div class="top-bar">
    <div class="top-bar-left">
      <img src="../assets/images/uh-logo.png" alt="UH Sugar Land logo" class="logo" />
      <span class="site-name">SUGAR LAND</span>
    </div>
    <div class="top-bar-right">
      <button class="search-icon-btn" type="button" aria-label="Search" aria-expanded="false">
        <img src="../assets/images/search-icon.png" alt="" />
      </button>
      <form class="site-search" role="search">
        <label class="sr-only" for="site-search-input">Search this site</label>
        <input id="site-search-input" type="search" placeholder="Search campus pages" autocomplete="off" />
        <button type="submit">Go</button>
        <p class="site-search-status" role="status"></p>
      </form>
    </div>
  </div>
  
  <nav>
    <ul class="menu">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="rooms.html">Campus</a></li>
    </ul>
  </nav>
</header>

  <section class="booking-form-section">
    <h2>Booking Form</h2>
    <form id="booking-form" class="booking-form">
      <div class="form-field form-field-wide">
        <label for="room">Room Name:</label>
        <input type="text" id="room" name="room" required readonly />
      </div>

      <div class="form-field">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-field">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-field">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required />
      </div>

      <div class="form-field">
        <label for="time">Time Slot:</label>
        <input type="time" id="time" name="time" required />
      </div>

      <button type="submit" class="submit-btn">Submit Booking</button>
    </form>
  </section>

<!-- Autofill link to booking -->
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/site.js" defer></script>


</body>
</html>
